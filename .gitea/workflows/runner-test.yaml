name: Print SBT and Bun Versions

on:
  workflow_dispatch:

jobs:
  print-versions:
    runs-on: rpi-pi
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print sbt version
        run: sbt --version

      - name: Print bun version
        run: bun --version

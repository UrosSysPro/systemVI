name: Build and publish main menu server image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: rpi-pi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect docker env
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          echo "DOCKER_TLS_VERIFY=$DOCKER_TLS_VERIFY"
          echo "DOCKER_CERT_PATH=$DOCKER_CERT_PATH"
          which docker || echo "no docker CLI"
          ls -la /var/run 2>/dev/null || true
          ls -la /certs 2>/dev/null || true

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.karaleic.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and publish Docker image
        run: sbt "mainMenuServer/Docker/publish"
